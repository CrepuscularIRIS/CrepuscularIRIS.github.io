<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crepuscular Citadel</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this for unknown paths. The site uses a hash
      // router, so hand the path to it: the in-app 404 (or the right page
      // if an old path-style link arrives) renders with all assets.
      var p = location.pathname.replace(/^\/+/, '')
      location.replace('/#/' + p + location.search + location.hash.replace(/^#\/?/, ''))
    </script>
  </head>
  <body style="background:#05070a"></body>
</html>
